[package]
name = "downtify-desktop"
version = "0.1.0"
edition = "2021"
description = "Windows client for a Downtify server with an offline local library"

[lib]
name = "downtify_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
directories = "5"
hostname = "0.4"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Foundation", "Media", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
